[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astcho"
version = "2.0.0"
description = "A privacy-conscious QQ AI companion with memory, mood, schedule, vision, and curated memes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Astcho contributors" }]
dependencies = [
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "openai>=1.50,<3",
  "chromadb>=1.0,<2",
  "sentence-transformers>=3,<6",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
astcho = "astcho.bot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
